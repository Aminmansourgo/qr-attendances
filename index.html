<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<title>تسجيل حضور الخدام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --navy:#1a237e; --navy2:#283593; --gold:#ffd700;
    --green:#2e7d32; --green-bg:#e8f5e9;
    --red:#c62828;   --red-bg:#ffebee;
    --amber:#ef6c00; --amber-bg:#fff8e1;
    --line:#e2e5ef;  --muted:#7a8095;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; padding:14px; background:#eef0f6; color:#1f2233;
    font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:15px;
  }
  .wrap { max-width:520px; margin:0 auto; }

  .head {
    background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
    border-radius:16px; padding:18px 16px; text-align:center; margin-bottom:14px;
    position:relative; overflow:hidden; box-shadow:0 4px 16px rgba(16,21,80,.15);
  }
  .head::after { content:''; position:absolute; inset-inline:0; bottom:0; height:3px;
                 background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .head h1 { margin:0; font-size:19px; }
  .head p  { margin:6px 0 0; font-size:13px; opacity:.9; }

  .card { background:#fff; border:1px solid var(--line); border-radius:16px;
          padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(16,21,80,.08); }

  #session { text-align:center; }
  #session .course { font-weight:700; color:var(--navy); font-size:17px; }
  #session .meta   { color:var(--muted); font-size:13px; margin-top:4px; }

  #reader { border-radius:14px; overflow:hidden; background:#000; min-height:220px; }
  #reader video { width:100% !important; display:block; }
  /* إخفاء عناصر المكتبة الافتراضية الزائدة */
  #reader__dashboard_section_csr > div:nth-child(2) { display:none !important; }
  #reader__dashboard_section_swaplink { color:var(--navy) !important; font-family:inherit !important; }

  .btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:50px; border:none; border-radius:12px;
    font-family:inherit; font-size:16px; font-weight:700; color:#fff;
    background:var(--navy); cursor:pointer; margin-top:10px;
  }
  .btn:disabled { opacity:.5; }
  .btn-green { background:var(--green); }
  .btn-ghost { background:#fff; color:var(--navy); border:2px solid var(--navy); }

  .result { border-radius:14px; padding:16px; margin-bottom:14px;
            font-weight:700; line-height:1.8; display:none; text-align:center; }
  .result.show { display:block; animation:pop .3s ease; }
  .ok   { background:var(--green-bg); color:var(--green); border:1px solid #a5d6a7; }
  .err  { background:var(--red-bg);   color:var(--red);   border:1px solid #ef9a9a; }
  .warn { background:var(--amber-bg); color:var(--amber); border:1px solid #ffcc80; }
  .info { background:#e8eaf6; color:var(--navy); border:1px solid #c5cae9; }
  @keyframes pop { from { opacity:0; transform:scale(.96); } }

  .spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35);
             border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
             display:inline-block; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .counter { text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .counter b { color:var(--navy); font-size:16px; }

  .log { max-height:190px; overflow-y:auto; margin-top:10px; }
  .log-row { display:flex; justify-content:space-between; gap:8px;
             padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .log-row span:last-child { color:var(--muted); font-size:12px; white-space:nowrap; }

  .manual-box { margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .or { text-align:center; color:var(--muted); font-size:13px; margin-bottom:8px; }
  .manual-box input { width:100%; padding:13px; border:1.5px solid var(--line);
                      border-radius:10px; font-family:inherit; font-size:16px; text-align:center; }
  .pick { text-align:center; font-size:13px; margin-top:8px; min-height:20px; color:var(--muted); }
  .pick b { color:var(--navy); }

  .fatal { background:#fff; border-radius:16px; padding:30px 20px; text-align:center;
           color:var(--red); font-weight:700; line-height:1.9; }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1>📷 تسجيل حضور الخدام</h1>
    <p>خدمة القديس برنابا الرسول لإعداد الخدام</p>
  </div>

  <div id="app" style="display:none">
    <div class="card" id="session">
      <div class="course" id="courseName">—</div>
      <div class="meta"  id="sessionMeta">—</div>
    </div>

    <div class="result" id="result"></div>

    <div class="card">
      <div id="reader"></div>
      <button class="btn btn-green" id="againBtn" style="display:none">🔄 مسح خادم آخر</button>
      <button class="btn btn-ghost" id="startBtn" style="display:none">▶️ تشغيل الكاميرا</button>

      <div class="manual-box">
        <div class="or">أو سجّل يدويًا بالاسم</div>
        <input id="nameSearch" list="rosterList" placeholder="اكتب أول حروف اسم الخادم…" autocomplete="off">
        <datalist id="rosterList"></datalist>
        <div id="pickInfo" class="pick"></div>
        <button class="btn" id="manualBtn" disabled>تسجيل يدوي</button>
      </div>

      <div class="counter">تم تسجيل <b id="count">0</b> خادم في هذه الجلسة</div>
    </div>

    <div class="card" id="logCard" style="display:none">
      <b style="color:var(--navy)">سجل هذه الجلسة</b>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div id="fatal" class="fatal" style="display:none"></div>
</div>

<script>
(function () {
  'use strict';

  /* ====================================================================
     البروتوكول الجديد:
     هذه الصفحة لا ترسل اسم الكورس ولا رقم المحاضرة إطلاقًا.
     ترسل كود الخادم + مفتاح الجلسة الذي أصدره المسؤول من لوحة التحكم،
     والسيرفر هو من يحدد الكورس والمحاضرة من الجلسة.
     ==================================================================== */

  var params  = new URLSearchParams(location.search);
  var API_URL = params.get('url') || '';
  var KEY     = params.get('key') || '';

  var scanner = null;
  var running = false;      // الكاميرا تعمل فعليًا
  var busy    = false;      // طلب قيد المعالجة — يمنع الإرسال المكرر
  var count   = 0;
  var lastCode = '', lastAt = 0;

  var $ = function (id) { return document.getElementById(id); };

  /* -------------------------------------------------- JSONP -------- */
  var jsonpSeq = 0;

  function jsonp(query, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cbName = 'qrcb_' + (++jsonpSeq) + '_' + Date.now();
      var script = document.createElement('script');
      var timer;

      function cleanup() {
        clearTimeout(timer);
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function (data) { cleanup(); resolve(data); };

      timer = setTimeout(function () {
        cleanup();
        reject(new Error('انتهت مهلة الاتصال بالسيرفر. تحقق من الإنترنت.'));
      }, timeoutMs || 25000);

      script.onerror = function () { cleanup(); reject(new Error('تعذّر الوصول للسيرفر.')); };
      script.src = API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') +
                   query + '&callback=' + cbName + '&_=' + Date.now();
      document.body.appendChild(script);
    });
  }

  /** إعادة محاولة صامتة — Apps Script أحيانًا يتأخر في البدء البارد. */
  function jsonpRetry(query, tries) {
    tries = tries || 3;
    return jsonp(query).catch(function (err) {
      if (tries <= 1) throw err;
      return new Promise(function (r) { setTimeout(r, 1200); })
        .then(function () { return jsonpRetry(query, tries - 1); });
    });
  }

  /* -------------------------------------------------- الواجهة ------ */

  function show(message, type) {
    var el = $('result');
    el.innerHTML = message;
    el.className = 'result show ' + type;
  }

  function hideResult() { $('result').className = 'result'; }

  function addLog(name, status, good) {
    $('logCard').style.display = 'block';
    var row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = '<span>' + (good ? '✅ ' : '⚠️ ') + escapeHtml(name) + '</span>' +
                    '<span>' + escapeHtml(status) + '</span>';
    $('log').insertBefore(row, $('log').firstChild);
  }

  function escapeHtml(v) {
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fatal(message) {
    $('app').style.display = 'none';
    $('fatal').style.display = 'block';
    $('fatal').innerHTML = message;
  }

  /* -------------------------------------------------- البدء -------- */

  if (!API_URL || !KEY) {
    fatal('⛔ رابط غير مكتمل.<br><br>' +
          'افتح هذه الصفحة من زر «فتح جلسة مسح» في لوحة التحكم، ' +
          'ولا تحفظ الرابط في المفضلة لأن المفتاح مؤقت.');
    return;
  }

  $('app').style.display = 'block';
  show('<span class="spinner" style="border-color:rgba(26,35,126,.3);border-top-color:#1a237e"></span> جاري التحقق من الجلسة…', 'info');

  jsonpRetry('api=scanInfo&key=' + encodeURIComponent(KEY))
    .then(function (res) {
      if (!res || !res.success) {
        fatal('⛔ ' + escapeHtml((res && res.message) || 'جلسة المسح غير صالحة.') +
              '<br><br>اطلب رابطًا جديدًا من المسؤول.');
        return;
      }
      $('courseName').textContent   = res.courseName;
      $('sessionMeta').textContent  = res.sessionTitle + '  •  ' + res.date;
      hideResult();
      startCamera();
      loadRoster();
    })
    .catch(function (err) {
      fatal('⛔ ' + escapeHtml(err.message));
    });

  /* -------------------------------------------------- القائمة ------ */

  var roster = [], byName = {}, picked = null;

  /**
   * قائمة الخدام للتسجيل بالاسم بدل حفظ الأكواد.
   * تُجلب بمفتاح الجلسة فقط، وتنتهي بانتهائه، وتحتوي الاسم والمجموعة فقط.
   */
  function loadRoster() {
    jsonpRetry('api=scanRoster&key=' + encodeURIComponent(KEY)).then(function (res) {
      if (!res || !res.success) return;
      roster = res.servants || [];
      byName = {};
      roster.forEach(function (s) { (byName[s.name] = byName[s.name] || []).push(s); });

      $('rosterList').innerHTML = Object.keys(byName).map(function (n) {
        return '<option value="' + escapeHtml(n) + '"></option>';
      }).join('');
    }).catch(function () { /* التسجيل بالكود يظل متاحًا */ });
  }

  function onNamePick() {
    var v = $('nameSearch').value.trim();
    var hits = byName[v] || [];

    if (hits.length === 1) {
      picked = hits[0];
      $('pickInfo').innerHTML = 'الكود: <b>' + escapeHtml(picked.code) + '</b>' +
        (picked.group ? ' — ' + escapeHtml(picked.group) : '');
      $('manualBtn').disabled = false;
      return;
    }

    picked = null;
    $('manualBtn').disabled = true;

    if (hits.length > 1) {
      $('pickInfo').innerHTML = '⚠️ يوجد ' + hits.length + ' بنفس الاسم — اكتب الكود بدلًا من الاسم';
      return;
    }

    // قد يكون المدخَل كودًا مباشرًا
    var up = v.toUpperCase();
    var byCode = roster.filter(function (s) { return s.code.toUpperCase() === up; })[0];
    if (byCode) {
      picked = byCode;
      $('pickInfo').innerHTML = '<b>' + escapeHtml(byCode.name) + '</b>';
      $('manualBtn').disabled = false;
      return;
    }

    $('pickInfo').textContent = v ? 'لم يتم العثور على هذا الاسم' : '';
  }

  /* -------------------------------------------------- الكاميرا ----- */

  /**
   * الإصلاح المهم: النسخة القديمة كانت تضبط isScanning داخل .then()
   * فتُستدعى startScanner قبل اكتمال الإيقاف وتخرج فورًا — والكاميرا لا تعود.
   * هنا كل شيء يمرّ بسلسلة وعود مرتّبة.
   */
  function startCamera() {
    if (running) return Promise.resolve();

    $('startBtn').style.display = 'none';
    if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });

    return scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 },
      onScan,
      function () { /* أخطاء القراءة العادية أثناء التحريك — تُتجاهل */ }
    ).then(function () {
      running = true;
    }).catch(function (err) {
      running = false;
      $('startBtn').style.display = 'flex';
      show('⛔ تعذّر فتح الكاميرا.<br>' +
           '<span style="font-weight:400;font-size:13px">' +
           'تأكد من السماح بالوصول للكاميرا في المتصفح، وأن الصفحة تُفتح عبر https.' +
           '</span>', 'err');
    });
  }

  function stopCamera() {
    if (!scanner || !running) return Promise.resolve();
    return scanner.stop()
      .then(function () { running = false; })
      .catch(function () { running = false; });
  }

  function onScan(decodedText) {
    if (busy) return;

    // المكتبة قد تُطلق نفس القراءة عدة مرات — نتجاهل التكرار خلال 3 ثوانٍ
    var now = Date.now();
    if (decodedText === lastCode && now - lastAt < 3000) return;
    lastCode = decodedText; lastAt = now;

    submit(decodedText);
  }

  /* -------------------------------------------------- الإرسال ----- */

  function submit(code) {
    if (busy) return;
    busy = true;

    stopCamera().then(function () {
      show('<span class="spinner" style="border-color:rgba(26,35,126,.3);border-top-color:#1a237e"></span> جاري التسجيل…', 'info');

      return jsonpRetry('api=scanQR&key=' + encodeURIComponent(KEY) +
                        '&decodedText=' + encodeURIComponent(code));
    }).then(function (res) {
      busy = false;
      if (!res) throw new Error('رد غير مفهوم من السيرفر.');

      if (res.success) {
        count++;
        $('count').textContent = count;
        show(res.message, 'ok');
        addLog(res.servantName || code, res.status || 'تم', true);
      } else {
        var isWarn = /مسجّل بالفعل|مسجل بالفعل/.test(res.message || '');
        show(res.message, isWarn ? 'warn' : 'err');
        addLog(code, 'مرفوض', false);
      }
      $('againBtn').style.display = 'flex';

    }).catch(function (err) {
      busy = false;
      show('⛔ ' + escapeHtml(err.message), 'err');
      $('againBtn').style.display = 'flex';
    });
  }

  /* -------------------------------------------------- الأزرار ----- */

  $('againBtn').addEventListener('click', function () {
    hideResult();
    lastCode = '';
    $('againBtn').style.display = 'none';
    startCamera();
  });

  $('startBtn').addEventListener('click', function () {
    hideResult();
    startCamera();
  });

  $('nameSearch').addEventListener('input', onNamePick);
  $('nameSearch').addEventListener('change', onNamePick);

  $('manualBtn').addEventListener('click', function () {
    if (!picked) return;
    var code = picked.code;
    $('nameSearch').value = '';
    $('pickInfo').textContent = '';
    $('manualBtn').disabled = true;
    picked = null;
    submit(code);
  });

  $('nameSearch').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && picked) $('manualBtn').click();
  });

  // إيقاف الكاميرا عند إخفاء الصفحة — يوفّر البطارية ويحرّر الكاميرا
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopCamera().then(function () {
        if (!busy) $('startBtn').style.display = 'flex';
      });
    }
  });

  window.addEventListener('beforeunload', function () { stopCamera(); });

})();
</script>
</body>
</html>
